<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>เที่ยวไทย ครบทุกจังหวัด | Fit Screen</title>
<style>
:root{--bg:#020f0c;--gold:#e9c46f;--cream:#fff2c8}*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;background:#020f0c;color:var(--cream);font-family:"Noto Sans Thai","Prompt","Segoe UI",system-ui,sans-serif}body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 50% 18%,rgba(255,209,112,.18),transparent 30%),linear-gradient(135deg,#020e0b,#05231b 48%,#010a08);z-index:-2}body:after{content:"";position:fixed;inset:0;background-image:radial-gradient(circle,rgba(255,223,145,.28) 0 1px,transparent 1.5px);background-size:62px 62px;opacity:.28;z-index:-1}.loader{height:100%;display:grid;place-items:center}.card{border:1px solid rgba(235,192,100,.52);border-radius:22px;background:rgba(5,34,27,.86);padding:24px 32px;box-shadow:0 0 44px rgba(233,192,103,.16);text-align:center}.logo{font-size:26px;font-weight:950;color:#ffd98e}.muted{margin-top:8px;color:#cbbd8a}.frame{position:fixed;inset:0;width:100%;height:100%;border:0;background:transparent;display:none}
</style>
</head>
<body>
<div class="loader" id="loader"><div class="card"><div class="logo">เที่ยวไทย ครบทุกจังหวัด</div><div class="muted">กำลังปรับขนาดให้พอดีจอ...</div></div></div>
<iframe class="frame" id="frame" title="Thailand Travel Dashboard"></iframe>
<script>
const SOURCE='https://raw.githubusercontent.com/Riptwosec-collab/-travel-Thai/3ffd9b7b30dcadfd7c0f014415664c912703c4c5/index.html';
const fitPatch=`
<style id="fit-screen-patch">
html,body{width:100%!important;height:100%!important;overflow:hidden!important;background:#020f0c!important}.app{transform-origin:0 0!important;will-change:transform}.bottom{transform-origin:bottom left!important;will-change:transform}.toast{transform-origin:bottom right!important}.side button{height:48px!important;margin:2px 0!important}.top{min-height:78px!important}.left{gap:10px!important}.panel{border-radius:16px!important}.hero{height:232px!important}.place{min-height:132px!important}.high{min-height:60px!important}.cta button{height:52px!important}.promo{min-height:150px!important}.donut{width:116px!important;height:116px!important}.donut:after{inset:24px!important}.stat{padding:8px!important;margin:7px 0!important}.body{padding:13px 14px!important}.scroll{padding:12px!important}.thai{height:88%!important;width:min(82%,650px)!important}.compass{width:92px!important;height:92px!important;bottom:42px!important}.bottom{bottom:10px!important}
@media(max-height:820px){.hero{height:210px!important}.place{min-height:116px!important}.high{min-height:52px!important}.body{padding:11px 13px!important}.stat{padding:7px!important}.promo{min-height:118px!important}.bottom div{padding:7px 14px!important}.thai{height:84%!important}.scroll{padding:10px!important}.q{padding:8px!important}.cta button{height:46px!important;font-size:22px!important}.share{height:36px!important}}
</style>`;
const fitScript=`
<script>
(function(){
  function fitDashboard(){
    const vw=window.innerWidth, vh=window.innerHeight;
    const baseW=1740, baseH=920;
    let scale=Math.min(vw/baseW, vh/baseH, .90);
    scale=Math.max(.68, Math.min(.90, scale));
    const app=document.querySelector('.app');
    if(app){
      app.style.transform='scale('+scale+')';
      app.style.width=(vw/scale)+'px';
      app.style.height=(vh/scale)+'px';
    }
    const bottom=document.querySelector('.bottom');
    if(bottom){
      bottom.style.transform='scale('+scale+')';
      bottom.style.left=(Math.max(170,250*scale))+'px';
      bottom.style.bottom='8px';
      bottom.style.maxWidth=(vw/scale-260)+'px';
    }
    const toast=document.querySelector('.toast');
    if(toast){toast.style.right='18px';toast.style.bottom='18px'}
  }
  window.addEventListener('resize',fitDashboard,{passive:true});
  window.addEventListener('load',fitDashboard,{once:true});
  requestAnimationFrame(fitDashboard);
})();
<\/script>`;
(async()=>{
  const loader=document.getElementById('loader');
  const frame=document.getElementById('frame');
  try{
    const res=await fetch(SOURCE,{cache:'no-store'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    let html=await res.text();
    html=html.replace('</head>',fitPatch+'</head>').replace('</body>',fitScript+'</body>');
    frame.srcdoc=html;
    frame.onload=()=>{loader.style.display='none';frame.style.display='block'};
  }catch(err){
    loader.innerHTML='<div class="card"><div class="logo">โหลดไม่สำเร็จ</div><div class="muted">กรุณารีเฟรชหน้าเว็บอีกครั้ง</div></div>';
    console.error(err);
  }
})();
</script>
</body>
</html>
