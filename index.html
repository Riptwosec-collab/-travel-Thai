<style>

:translate(-50%,-50%);filter:drop-shadow(0 22px 25px rgba(0,0,0,.45)) drop-shadow(0 0 18px rgba(232,186,76,.2))}.province-path{fill:rgba(23,81,58,.78);stroke:rgba(235,190,83,.78);stroke-width:1.2;cursor:pointer;transition:.2s}.province-path:hover,.province-path.selected{fill:rgba(36,118,78,.98);stroke:#ffe08c;stroke-width:2.6;filter:drop-shadow(0 0 13px #ffc764)}.province-path.visited{fill:rgba(92,149,91,.9)}.province-path.wishlist{fill:rgba(170,92,73,.9)}.province-label{fill:#efd486;font-size:11px;font-weight:900;text-anchor:middle;pointer-events:none;text-shadow:0 1px 4px #000}.province-label.selected{font-size:18px;fill:#fff1ba}.fallback-line{fill:none;stroke:rgba(235,190,83,.45);stroke-width:1}.sea{position:absolute;color:#e8c97d;font-weight:900;text-shadow:0 0 8px rgba(255,202,94,.35)}.andaman{left:34px;bottom:270px}.gulf{right:150px;bottom:170px;font-size:22px}.tip{position:absolute;left:27%;top:30%;padding:10px 16px;border-radius:11px;border:1px solid rgba(255,210,115,.6);background:rgba(6,30,24,.88);color:#f5d78e;text-align:center;font-size:12px}.compass{position:absolute;right:20px;bottom:18px;width:100px;height:100px;border-radius:50%;border:1px solid rgba(255,210,115,.65);display:grid;place-items:center;color:#f5d488;font-weight:950}.filters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}.field{display:grid;gap:6px}.field label{font-size:12px;color:#d6c78e;font-weight:900}.field input,.field select,.field textarea{width:100%;border:1px solid rgba(255,219,132,.25);border-radius:13px;background:rgba(3,25,20,.65);color:var(--cream);padding:11px;outline:0}.timeline{display:grid;gap:12px}.step{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;padding:13px;border:1px solid rgba(255,219,132,.18);border-radius:16px;background:rgba(4,29,23,.55)}.num{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:rgba(255,216,138,.12);border:1px solid rgba(255,216,138,.25);color:var(--gold2);font-weight:950}.feed{display:grid;grid-template-columns:1.5fr .9fr;gap:14px}.post{padding:14px;border:1px solid rgba(255,219,132,.22);border-radius:18px;background:rgba(4,28,22,.56)}.gallery{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}.gallery .photo:first-child{height:310px}.state{padding:18px;border:1px dashed rgba(255,219,132,.35);border-radius:18px;background:rgba(6,38,30,.44)}.skeleton{height:16px;border-radius:99px;background:linear-gradient(90deg,rgba(255,255,255,.05),rgba(255,219,132,.18),rgba(255,255,255,.05));animation:sk 1.2s linear infinite;background-size:220% 100%}@keyframes sk{to{background-position:-220% 0}}.toast{position:fixed;right:22px;bottom:22px;z-index:100;padding:14px 18px;border-radius:18px;background:rgba(5,32,25,.92);border:1px solid var(--line);box-shadow:0 0 28px rgba(233,192,103,.18);transform:translateY(120px);transition:.25s}.toast.show{transform:translateY(0)}.mobile-nav{display:none}@media(max-width:1180px){:root{--side:82px}.topbar{grid-template-columns:210px 1fr 140px}.topnav{display:none}.search{max-width:none}.side-item span{display:none}.side-item{justify-content:center;padding:0}.side-item.active:before{display:none}.map-shell,.feed{grid-template-columns:1fr}.cols-4,.cols-3{grid-template-columns:repeat(2,minmax(0,1fr))}.span-3,.span-2{grid-column:span 1}}@media(max-width:760px){:root{--top:74px;--side:0}.topbar{grid-template-columns:1fr 96px;padding:12px}.brand span,.search{display:none}.layout{grid-template-columns:1fr}.sidebar{display:none}.cols-2,.cols-3,.cols-4,.filters{grid-template-columns:1fr}.hero h1{font-size:38px}.map-card{min-height:520px}.mobile-nav{position:fixed;z-index:80;left:10px;right:10px;bottom:10px;height:64px;display:grid;grid-template-columns:repeat(5,1fr);gap:6px;border:1px solid var(--line);border-radius:22px;background:rgba(4,30,24,.92);backdrop-filter:blur(16px);padding:7px}.mobile-nav button{border:0;background:transparent;color:#ebd28d;border-radius:16px;font-size:11px;font-weight:900}.mobile-nav button.active{background:linear-gradient(145deg,#14684c,#0a3b30);box-shadow:0 0 16px rgba(240,190,78,.25)}}

<body>
<div id='app'></div><div id='toast' class='toast'>พร้อมใช้งาน</div>
<script>
const A=['home','map','provinces','places','activities','inspiration','planner','journal','trips','saved','community','profile','analytics','notifications','settings','search','auth','onboarding','states'];
const menus=[['home','🏠','หน้าหลัก'],['map','🗺️','แผนที่'],['provinces','📍','จังหวัด'],['places','🏛️','สถานที่'],['activities','✨','กิจกรรม'],['inspiration','💡','แรงบันดาลใจ'],['planner','📅','แผนการเดินทาง'],['journal','📝','บันทึกการเดินทาง'],['trips','🧳','ทริปของฉัน'],['saved','♡','รายการโปรด'],['community','👥','คอมมูนิตี้'],['profile','👤','โปรไฟล์'],['analytics','📊','สถิติ'],['notifications','🔔','แจ้งเตือน'],['settings','⚙️','ตั้งค่า']];
const prov=['เชียงใหม่','เชียงราย','น่าน','อุดรธานี','ขอนแก่น','นครราชสีมา','อุบลราชธานี','กรุงเทพมหานคร','ชลบุรี','กาญจนบุรี','สุราษฎร์ธานี','ภูเก็ต','กระบี่','สงขลา','นราธิวาส'];
const places=['วัดพระธาตุดอยสุเทพ','ดอยอินทนนท์','ประตูท่าแพ','บ้านแม่กำปอง','หาดป่าตอง','เกาะพีพี','น้ำตกเอราวัณ','สามพันโบก'];
const state={route:'home',selected:'เชียงใหม่',status:JSON.parse(localStorage.ttStatus||'{}'),zoom:1,features:[]};
function save(){localStorage.ttStatus=JSON.stringify(state.status)}function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1500)}
function app(){document.getElementById('app').innerHTML=`<div class='app'><header class='topbar'><div class='brand'><div class='mark'>⛩</div><div><b>เที่ยวไทย</b><span>ครบทุกจังหวัด</span></div></div><label class='search'>⌕<input placeholder='ค้นหาจังหวัด, สถานที่, กิจกรรม...'><button class='filter-btn'>⚙</button></label><nav class='topnav'>${[['home','หน้าหลัก'],['map','แผนที่'],['inspiration','แรงบันดาลใจ'],['planner','แผนการเดินทาง'],['community','คอมมูนิตี้']].map(x=>`<button data-route='${x[0]}'>${x[1]}</button>`).join('')}</nav><div class='actions'><button class='round' data-route='notifications'>🔔<span class='badge'>3</span></button><button class='round' data-route='saved'>♡</button><button class='avatar' data-route='profile'></button></div></header><div class='layout'><aside class='sidebar'><div class='side-scroll'>${menus.map(m=>`<button class='side-item' data-route='${m[0]}'>${m[1]} <span>${m[2]}</span></button>`).join('')}</div><div class='side-footer'><div class='night'>โหมดกลางคืน <span class='switch'></span></div></div></aside><main id='view'></main></div><nav class='mobile-nav'>${[['home','หน้าแรก'],['map','แผนที่'],['planner','ทริป'],['saved','โปรด'],['profile','โปรไฟล์']].map(x=>`<button data-route='${x[0]}'>${x[1]}</button>`).join('')}</nav></div>`;document.querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>{location.hash=b.dataset.route})}
function active(){document.querySelectorAll('[data-route]').forEach(b=>b.classList.toggle('active',b.dataset.route===state.route))}
function head(t,d,act=''){return `<div class='page-head'><div><div class='eyebrow'>Luxury Thailand Travel Map</div><h1 class='title'>${t}</h1><p class='desc'>${d}</p></div><div class='toolbar'>${act}</div></div>`}
function stats(){return `<section class='grid cols-4'><div class='panel stat'><div class='ico'>✓</div><div><div class='muted small'>จังหวัดที่ไปแล้ว</div><b>23</b><div class='progress'><i style='width:30%'></i></div></div></div><div class='panel stat'><div class='ico'>♡</div><div><div class='muted small'>จังหวัดที่อยากไป</div><b>32</b><div class='progress'><i style='width:42%'></i></div></div></div><div class='panel stat'><div class='ico'>🗺</div><div><div class='muted small'>จังหวัดทั้งหมด</div><b>77</b><div class='progress'><i style='width:100%'></i></div></div></div><div class='panel stat'><div class='ico'>🔥</div><div><div class='muted small'>Travel Streak</div><b>12 วัน</b><div class='progress'><i style='width:65%'></i></div></div></div></section>`}
function cards(arr){return arr.map((x,i)=>`<article class='card'><div class='photo'><div class='place-title'>${x}</div></div><div class='body'><h3>${x}</h3><p class='muted small'>ภาพท่องเที่ยว Editorial โทน Golden Hour พร้อมข้อมูลเดินทาง</p><div class='toolbar'><span class='chip ${i%3==0?'visited':i%3==1?'wishlist':'planning'}'>${i%3==0?'ไปแล้ว':i%3==1?'อยากไป':'กำลังวางแผน'}</span><button class='btn ghost'>ดูรายละเอียด</button></div></div></article>`).join('')}
function donut(title='สถิติการเดินทาง'){return `<div class='panel'><div class='body'><h3>${title}</h3><div style='display:flex;gap:18px;align-items:center'><div class='donut' data-text='55\Aจังหวัด'></div><div class='bars' style='flex:1'>${[['ภาคเหนือ',15,70],['ภาคอีสาน',18,82],['ภาคกลาง',9,52],['ภาคตะวันออก',6,38],['ภาคใต้',7,45]].map(r=>`<div class='row'><span>${r[0]}</span><div class='progress'><i style='width:${r[2]}%'></i></div><b>${r[1]}</b></div>`).join('')}</div></div></div></div>`}

function mapPage(){return head('แผนที่','สำรวจประเทศไทยผ่านแผนที่ Interactive และกดเลือกจังหวัด',`<button class='btn ghost' onclick='zoom(.9)'>−</button><button class='btn ghost' onclick='zoom(1.1)'>+</button><button class='btn gold' onclick='resetMap()'>Reset</button>`)+`<div class='filters'><select><option>ทุกภูมิภาค</option><option>ภาคเหนือ</option><option>ภาคใต้</option></select><select><option>ทุกสถานะ</option><option>ไปแล้ว</option><option>อยากไป</option></select><input placeholder='ค้นหาจังหวัด'><button class='btn primary'>Locate Me</button></div><section class='map-shell'><div class='map-card'><div class='sea andaman'>ทะเลอันดามัน</div><div class='sea gulf'>อ่าวไทย</div><div class='tip'>คลิกที่จังหวัด<br>เพื่อดูข้อมูลและสถานที่เที่ยว</div><div class='compass'>N</div><svg id='mapSvg' class='map-svg' viewBox='0 0 620 880'><defs><linearGradient id='lg' x1='0' x2='1' y1='0' y2='1'><stop stop-color='#227457'/><stop offset='1' stop-color='#0b382e'/></linearGradient></defs><g id='paths'></g><g id='labels'></g></svg></div><aside id='detail'></aside></section>`}

const urls=['https://gis-portal.disaster.go.th/arcgis/rest/services/DDPM_MAP_PROVINCE/MapServer/0/query?where=1%3D1&outFields=*&f=geojson'];
function nameOf(p){return p.PROV_NAMT||p.PROV_NAME||p.NAME_T||p.NAME_TH||p.ADM1_TH||p.name_th||p.name||p.NAME||'จังหวัด'}
function coords(g){let out=[];(function w(a){if(typeof a[0]==='number')out.push(a);else a.forEach(w)})(g.coordinates);return out}
function fit(points){let minX=99,minY=99,maxX=-99,maxY=-99;points.forEach(p=>{minX=Math.min(minX,p[0]);maxX=Math.max(maxX,p[0]);minY=Math.min(minY,p[1]);maxY=Math.max(maxY,p[1])});const W=620,H=880,p=34,s=Math.min((W-p*2)/(maxX-minX),(H-p*2)/(maxY-minY));const ox=(W-(maxX-minX)*s)/2,oy=(H-(maxY-minY)*s)/2;return p=>[ox+(p[0]-minX)*s,oy+(maxY-p[1])*s]}
function path(g,pr){const ring=r=>r.map((p,i)=>{let q=pr(p);return `${i?'L':'M'}${q[0].toFixed(1)} ${q[1].toFixed(1)}`}).join(' ')+' Z';return g.type==='Polygon'?g.coordinates.map(ring).join(' '):g.coordinates.flatMap(p=>p.map(ring)).join(' ')}
function center(cs,pr){let x=0,y=0,n=0;cs.forEach(c=>{let p=pr(c);x+=p[0];y+=p[1];n++});return[x/n,y/n]}
async function loadMap(){let gp=document.getElementById('paths');if(!gp||gp.dataset.loaded)return;gp.dataset.loaded=1;try{let r=await fetch(urls[0]);let d=await r.json();let f=(d.features||[]).filter(x=>x.geometry&&/Polygon/.test(x.geometry.type));if(f.length>40){geo(f);return}}catch(e){}fallback()}
function geo(f){let gp=document.getElementById('paths'),gl=document.getElementById('labels');gp.innerHTML='';gl.innerHTML='';let all=f.flatMap(x=>coords(x.geometry)),pr=fit(all);state.features=f.map(x=>{let n=nameOf(x.properties),cs=coords(x.geometry),c=center(cs,pr),p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',path(x.geometry,pr));p.setAttribute('class','province-path');p.dataset.name=n;p.onclick=()=>{state.selected=n;syncMap()};gp.appendChild(p);let l=document.createElementNS('http://www.w3.org/2000/svg','text');l.setAttribute('x',c[0]);l.setAttribute('y',c[1]);l.textContent=n;l.dataset.name=n;l.setAttribute('class','province-label');gl.appendChild(l);return{name:n,c,path:p}});state.selected='เชียงใหม่';syncMap()}
function fallback(){let gp=document.getElementById('paths'),gl=document.getElementById('labels');if(!gp)return;gp.innerHTML='';gl.innerHTML='';let outline=[[97.25,20.45],[98.3,18.65],[98.0,17.75],[98.65,16.95],[98.55,16.05],[99.4,15.45],[99.1,14.35],[99.7,12.35],[98.55,9.8],[98.35,8.15],[99.25,6.65],[100.1,6.1],[101.85,6.35],[101.25,7.25],[100.6,7.55],[100.05,9.55],[99.75,10.45],[100.75,12.35],[102.75,12.55],[103.05,13.4],[102.7,14.15],[104.15,14.45],[105.55,15.25],[105.55,16.2],[104.75,17.25],[103.7,18.3],[102.55,18.0],[101.25,18.35],[100.7,19.25],[100.05,20.35],[98.95,20.75],[97.25,20.45]],pts=outline.concat(prov.map((n,i)=>[98.8+(i%5)*1.15,19.2-Math.floor(i/5)*3.2])),pr=fit(pts);let base=document.createElementNS('http://www.w3.org/2000/svg','path');base.setAttribute('d',outline.map((p,i)=>{let q=pr(p);return `${i?'L':'M'}${q[0].toFixed(1)} ${q[1].toFixed(1)}`}).join(' ')+' Z');base.setAttribute('class','province-path');gp.appendChild(base);state.features=prov.map((n,i)=>{let c=pr([98.8+(i%5)*1.15,19.2-Math.floor(i/5)*3.2]);let o=document.createElementNS('http://www.w3.org/2000/svg','circle');o.setAttribute('cx',c[0]);o.setAttribute('cy',c[1]);o.setAttribute('r',n==='เชียงใหม่'?17:10);o.setAttribute('class','province-path');o.dataset.name=n;o.onclick=()=>{state.selected=n;syncMap()};gp.appendChild(o);let l=document.createElementNS('http://www.w3.org/2000/svg','text');l.setAttribute('x',c[0]);l.setAttribute('y',c[1]);l.textContent=n;l.dataset.name=n;l.setAttribute('class','province-label');gl.appendChild(l);return{name:n,c,path:o}});syncMap()}
function syncMap(){document.querySelectorAll('.province-path').forEach(p=>{let n=p.dataset.name;p.classList.toggle('selected',n===state.selected);p.classList.toggle('visited',state.status[n]==='visited');p.classList.toggle('wishlist',state.status[n]==='wishlist')});document.querySelectorAll('.province-label').forEach(l=>l.classList.toggle('selected',l.dataset.name===state.selected));let d=document.getElementById('detail');if(d)d.innerHTML=detailPanel(state.selected)}
function zoom(f){state.zoom=Math.max(.7,Math.min(1.8,state.zoom*f));let s=document.getElementById('mapSvg');if(s)s.style.transform=`translate(-50%,-50%) scale(${state.zoom})`;toast('Zoom '+Math.round(state.zoom*100)+'%')}function resetMap(){state.zoom=1;let s=document.getElementById('mapSvg');if(s)s.style.transform='translate(-50%,-50%) scale(1)';toast('รีเซ็ตแผนที่แล้ว')}
window.addEventListener('hashchange',render);app();render();
</script>
</body>
